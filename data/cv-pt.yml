experiencia:
  - empresa: "Rumo Logística"
    cargo: "Cientista de Dados, Inteligência de Dados"
    periodo: "Ago 2024 – Ago 2026"
    local: "Curitiba, PR"
    contexto: >
      Ingressei pelo programa Talento Inovação (IEL) para mestres e fui internalizado em abril de 2025.
    bullets:
      - tier: 1
        texto: >
          Elevei a precisão de *55% para 95%* e a sensibilidade de *39% para 60%* na previsão de
          interdições de via por bitola aberta, frente ao baseline de regressão linear. Isso aumentou
          a assertividade das manutenções preventivas e evitou o alto custo operacional das interdições.
      - tier: 1
        texto: >
          Responsável pela frente de Ciência de Dados do VIAbiliza, projeto *mapeado pela McKinsey entre
          os de maior impacto da companhia*. Propus, desenvolvi e implementei de ponta a ponta os modelos
          preditivos hoje em produção.
      - tier: 1
        texto: >
          Identifiquei na literatura o estado da arte para predição de degradação de geometria de via
          (LSTM com convolução espacial, aplicada a ferrovias de alta velocidade em Tóquio) e adaptei a
          solução ao contexto de ferrovia de carga, com pré-processamento, treinamento e critérios de
          avaliação próprios.
      - tier: 1
        texto: >
          Desenvolvi e treinei modelos de deep learning para previsão espaço-temporal das irregularidades
          da via, com arquiteturas ConvLSTM, ConvGRU e CNN+Attention em PyTorch e PyTorch Lightning, além de um
          mecanismo próprio de fusão de variáveis exógenas (embeddings + concatenação no eixo de canais).
      - tier: 1
        texto: >
          Resolvi o desalinhamento geográfico entre passagens do vagão instrumentado, um problema conhecido
          do setor e até então sem solução na companhia, com um algoritmo que alinha *mais de 99%* dos dados
          e viabilizou toda a modelagem preditiva subsequente.
      - tier: 1
        texto: >
          Construí um algoritmo de detecção de anomalias, baseado apenas em medidas estatísticas, para
          identificar picos de medição nos dados do vagão instrumentado. Ele separa leituras inválidas ou
          fisicamente impossíveis antes da modelagem, o que era essencial num sinal bruto e ruidoso.
      - tier: 1
        texto: >
          Arquitetei e implementei a pipeline de dados e ML em Kedro: do ETL no Amazon Athena à geração de
          datasets no S3, treinamento com rastreamento de experimentos em MLflow e inferência em produção,
          parametrizada por variável-alvo e capaz de comparar múltiplos modelos candidatos.
      - tier: 1
        texto: >
          Deploy e manutenção dos modelos em produção: inferência em batch por pipelines agendadas e serviço
          containerizado em AWS ECS acionado por outras equipes, com integração e consumo via APIs REST.
      - tier: 1
        texto: >
          Tratei dados de geometria de via em larga escala, com medições a cada *25 cm ao longo de mais de
          1.500 km* e passagens quinzenais nos dois sentidos, fazendo a limpeza, a normalização e a construção
          das janelas espaço-temporais usadas como entrada dos modelos.
      - tier: 1
        texto: >
          Primeiro projeto: priorizador de manutenção de dormentes, construído de ponta a ponta em cerca de
          5 meses, cobrindo ETL, enriquecimento com dados de operação (MTBT e histórico de manutenções),
          modelo preditivo de degradação da bitola e dashboard em Power BI usado no planejamento estratégico
          do corredor Rondonópolis/MT a Santos/SP.
      - tier: 2
        texto: >
          Engenharia de features a partir de múltiplas fontes, entre elas tonelagem transportada (MTBT),
          defeitos de infraestrutura, indicadores de pico e degradação, interação veículo-via (VTI), chuva,
          sazonalidade e tipo de dormente, todas transformadas em tensores e incorporadas aos modelos como
          variáveis exógenas.
      - tier: 2
        texto: >
          Ajudei a desenvolver os ingestores que passaram a alimentar o AWS Athena: os dados do vagão
          instrumentado existiam apenas em arquivos .csv, o que inviabilizava qualquer análise mais extensa.
      - tier: 2
        texto: >
          Conduzi a avaliação comparativa entre regressão linear, modelos baseados em árvores de decisão
          (Random Forest, XGBoost) e arquiteturas recorrentes.
      - tier: 2
        texto: >
          Análise de viabilidade de novo sensor embarcado no vagão instrumentado para detecção de
          levantamento de trilho, gerando os insights que orientaram a decisão de instalação.
      - tier: 3
        texto: >
          Stack AWS: ingestão e consultas em Amazon Athena (awswrangler), processamento com AWS Glue e
          Lambda, armazenamento em S3, desenvolvimento e treino em Amazon SageMaker e execução em ECS;
          manipulação de grandes volumes com Pandas e Polars.
      - tier: 2
        texto: >
          Elaboração da documentação técnica dos projetos e modelos, em atuação colaborativa com times de
          negócio (Confiabilidade de Via), tecnologia e dados, em rotina ágil com daily, sprint planning
          e sprint review.

  - empresa: "CARISSMA Institute of Automated Driving"
    cargo: "Pesquisador, bolsista do governo alemão"
    periodo: "Set 2022 – Mar 2023"
    local: "Ingolstadt, Alemanha"
    contexto: ""
    bullets:
      - tier: 1
        texto: >
          Desenvolvimento do TWICE Dataset, conjunto de dados público para pesquisa em veículos autônomos
          com sensores de câmera, radar, LiDAR e GNSS/IMU, sob supervisão dos professores Werner Huber e
          Eduardo Parente Ribeiro. Trabalho publicado em periódico internacional revisado por pares.
      - tier: 1
        texto: >
          Responsável pelo labelling de todo o conjunto de dados, feito de forma semiautomática combinando
          algoritmos de visão computacional (YOLO) com um algoritmo genético.
      - tier: 1
        texto: >
          Análise e validação com segmentação semântica (YOLOP) para quantificar o simulation-to-reality gap
          entre os testes reais e seus respectivos gêmeos digitais.
      - tier: 2
        texto: >
          Processamento, transformação e organização de todo o volume de dados coletado pelos pesquisadores
          do instituto, publicando-os em formato agnóstico e acessível e desenvolvendo as ferramentas para
          abrir, visualizar e processar os arquivos. Python como ferramenta principal, junto a MATLAB, ROS
          e Google Protocol Buffers.

