experiencia:
  - empresa: "Rumo Logística"
    cargo: "Data Scientist, Data Intelligence"
    periodo: "Aug 2024 – Aug 2026"
    local: "Curitiba, Brazil"
    contexto: >
      Joined through the Talento Inovação programme (IEL) for master's graduates and was hired directly by the company in April 2025.
    bullets:
      - tier: 1
        texto: >
          Raised precision from *55% to 95%* and recall from *39% to 60%* in predicting track
          closures caused by gauge widening, against a linear-regression baseline. This increased the
          accuracy of preventive maintenance and avoided the high operational cost of track closures.
      - tier: 1
        texto: >
          Main developer of the predictive models on VIAbiliza, a project *identified by McKinsey as one
          of the highest-impact initiatives in the company*. I proposed the solution and implemented it
          end to end, and the models are currently running in production.
      - tier: 1
        texto: >
          Identified the state of the art in the literature for predicting track-geometry degradation
          (LSTM with spatial convolution, applied to high-speed railways in Tokyo) and adapted the
          solution to a heavy-haul freight context, with custom preprocessing, training and evaluation criteria.
      - tier: 1
        texto: >
          Developed and trained deep learning models for spatio-temporal forecasting of track
          irregularities, using ConvLSTM, ConvGRU and CNN+Attention architectures in PyTorch and PyTorch
          Lightning, plus a custom exogenous-variable fusion mechanism (embeddings + concatenation
          along the channel axis).
      - tier: 1
        texto: >
          Solved the geographic misalignment between runs of the track geometry car, a well-known
          problem in the industry with no prior solution at the company, with an algorithm that
          aligns *over 99%* of the data and enabled all subsequent predictive modelling.
      - tier: 1
        texto: >
          Built a statistics-based anomaly detection algorithm to flag measurement spikes in the track
          geometry car data, filtering out invalid or physically impossible readings before modelling.
          This was essential when working from a raw, noisy sensor signal.
      - tier: 1
        texto: >
          Designed and implemented the data and ML pipeline in Kedro: from ETL on Amazon Athena to
          dataset generation on S3, training with experiment tracking in MLflow, and production
          inference. The pipeline is parameterised by target variable and can compare multiple candidate models.
      - tier: 1
        texto: >
          Deployment and maintenance of models in production: batch inference through scheduled
          pipelines and a containerised service on AWS ECS consumed by other teams, integrated via REST APIs.
      - tier: 1
        texto: >
          Processed track-geometry data at scale, with measurements every *25 cm across more than 1,500 km*
          and runs every two weeks in both directions, handling cleaning, normalisation and the construction
          of the spatio-temporal windows used as model input.
      - tier: 1
        texto: >
          First project: a sleeper (tie) maintenance prioritiser, built end to end in around 5 months,
          covering ETL, enrichment with operational data (gross tonnage and maintenance history), a
          predictive model of gauge degradation, and a Power BI dashboard used in strategic planning for
          the Rondonópolis to Santos corridor.
      - tier: 2
        texto: >
          Feature engineering from multiple sources, including gross tonnage transported (MGT),
          infrastructure defects, peak and degradation indicators, vehicle-track interaction (VTI),
          rainfall, seasonality and sleeper type, all transformed into tensors and fed to the models as
          exogenous variables.
      - tier: 2
        texto: >
          Helped build the ingestion services that began feeding AWS Athena: the track geometry car data
          existed only as .csv files, which made any large-scale analysis unfeasible.
      - tier: 2
        texto: >
          Ran the comparative evaluation between linear regression, tree-based models (Random Forest,
          XGBoost) and recurrent architectures.
      - tier: 2
        texto: >
          Feasibility analysis of a new onboard sensor on the track geometry car for rail-lift detection,
          producing the insights that guided the installation decision.
      - tier: 3
        texto: >
          AWS stack: ingestion and querying on Amazon Athena (awswrangler), processing with AWS Glue and
          Lambda, storage on S3, development and training on Amazon SageMaker and execution on ECS;
          handling of large data volumes with Pandas and Polars.
      - tier: 2
        texto: >
          Technical documentation of projects and models, working collaboratively with business (Track
          Reliability), technology and data teams in an agile routine of daily, sprint planning and sprint review.

  - empresa: "CARISSMA Institute of Automated Driving"
    cargo: "Researcher, German government scholarship"
    periodo: "Sep 2022 – Mar 2023"
    local: "Ingolstadt, Germany"
    contexto: ""
    bullets:
      - tier: 1
        texto: >
          Development of the TWICE Dataset, a public dataset for autonomous vehicle research with camera,
          radar, LiDAR and GNSS/IMU sensors, under the supervision of Professors Werner Huber and Eduardo
          Parente Ribeiro. Published in a peer-reviewed international journal.
      - tier: 1
        texto: >
          Responsible for labelling the entire dataset, done semi-automatically by combining computer
          vision algorithms (YOLO) with a genetic algorithm.
      - tier: 1
        texto: >
          Analysis and validation using semantic segmentation (YOLOP) to quantify the simulation-to-reality
          gap between the real tests and their digital twins.
      - tier: 2
        texto: >
          Processing, transformation and organisation of the full volume of data collected by the institute's
          researchers, publishing it in an agnostic and accessible format and developing the tools to open,
          visualise and process the files. Python as the main tool, alongside MATLAB, ROS and Google Protocol Buffers.

